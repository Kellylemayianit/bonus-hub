name = "bonas-hub"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bonas-hub"
database_id = "REPLACE_AFTER_wrangler_d1_create"

# Secrets (wrangler secret put ...): TURNSTILE_SECRET,
# SUPABASE_URL, SUPABASE_SERVICE_KEY, CLOUDINARY_API_SECRET
[vars]
APP_URL = "https://bonas-hub.ligospace-ke.workers.dev"
SUPABASE_BUCKET = "verification-docs"
# First admin: set ADMIN_EMAILS (comma list). That email becomes admin when it registers.
# ADMIN_EMAILS = "you@example.com"

name = "bonas-hub"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bonas-hub"
database_id = "REPLACE_AFTER_wrangler_d1_create"

# Cron drains email_outbox (step 7 wires Resend)
[triggers]
crons = ["*/5 * * * *"]

# Secrets (wrangler secret put ...): TURNSTILE_SECRET, RESEND_API_KEY,
# SUPABASE_URL, SUPABASE_SERVICE_KEY, CLOUDINARY_API_SECRET
[vars]
APP_URL = "http://localhost:8787"
SUPABASE_BUCKET = "verification-docs"
# First admin: set ADMIN_EMAILS (comma list). That email becomes admin when it registers.
# ADMIN_EMAILS = "you@example.com"
